<style>
.hero{text-align:center;padding:40px 20px 26px}
.hero .gtitle{font-size:clamp(2.6rem,8vw,5rem)}
.stats2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.tab{padding:10px 18px;border-radius:999px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:1rem}
.tab.on{background:linear-gradient(135deg,var(--a),var(--b));color:#0A0F25}
.sec h2{font-size:1.5rem;margin:26px 4px 12px;font-weight:900;display:flex;align-items:center;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gc{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;text-decoration:none;color:var(--txt);min-height:190px;overflow:hidden;
 background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.gc::before{content:'';position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--ca),transparent 70%);opacity:.55}
.gc:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 2px var(--ca)}
.gc .no{font-weight:900;letter-spacing:2px;font-size:.85rem;color:var(--ca)}
.gc .ic{font-size:2.6rem}
.gc .gn{font-weight:900;font-size:1.25rem;line-height:1.15}
.gc .tt{font-weight:600;color:var(--mut);font-size:.95rem;line-height:1.3}
.gc .pr{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
.gc .pr .bar{flex:1;height:10px}
.gc .cp{position:absolute;right:12px;top:12px;z-index:2;padding:6px 10px;border-radius:10px;font-weight:800;font-size:.85rem;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--txt)}
.gc .cp:hover{background:var(--ca);color:#0A0F25}
.gc .pr .bar i{background:linear-gradient(90deg,var(--ca),var(--gold))}
</style>
</head>
<body data-share-title="Gamifikasi Alfaqih – Semua Game Tingkatan 4">
<div class="wrap">
 <div class="glass hero">

 </div>

 <div class="tabs" id="tabs"></div>

</div>
<script>
const L=[{"id": "p1", "no": 1, "bidang": "Al-Quran", "title": "Surah al-An'am, ayat 162–163", "game": "Kembara Pelita Hamba", "a": "#FFB547", "b": "#22D3EE", "icon": "🏮"}, {"id": "p2", "no": 2, "bidang": "Al-Quran", "title": "Surah al-Kahfi, ayat 101–110", "game": "Perisai Al-Kahfi", "a": "#38BDF8", "b": "#818CF8", "icon": "🛡️"}, {"id": "p3", "no": 3, "bidang": "Al-Quran", "title": "Hukum Tajwid: Mad Silah, Mad Lazim dan Qalqalah", "game": "Tajwid Arena", "a": "#34D399", "b": "#22D3EE", "icon": "🎙️"}, {"id": "p4", "no": 4, "bidang": "Al-Quran", "title": "Larangan Rasuah (Surah al-Baqarah, ayat 188)", "game": "Ops Anti-Rasuah", "a": "#F43F5E", "b": "#F59E0B", "icon": "🚫"}, {"id": "p5", "no": 5, "bidang": "Al-Quran", "title": "Memahami Sunnatullah (Surah Ali Imran, ayat 137–139)", "game": "Pengembara Sunnatullah", "a": "#A3E635", "b": "#14B8A6", "icon": "🧭"}, {"id": "p6", "no": 6, "bidang": "Al-Quran", "title": "Larangan Mempersendakan Agama (Surah al-An'am, ayat 70)", "game": "Benteng Kesucian", "a": "#60A5FA", "b": "#F472B6", "icon": "🏰"}, {"id": "p7", "no": 7, "bidang": "Al-Quran", "title": "Dakwah Pemacu Kemajuan (Surah Fussilat, ayat 33)", "game": "Misi Pendakwah", "a": "#FBBF24", "b": "#10B981", "icon": "📣"}, {"id": "p8", "no": 8, "bidang": "Hadis", "title": "Hindari Dosa (Tujuh Dosa Besar)", "game": "Ops 7 Pemusnah", "a": "#EF4444", "b": "#8B5CF6", "icon": "☠️"}, {"id": "p9", "no": 9, "bidang": "Hadis", "title": "Kemuliaan Berdikari", "game": "Usahawan Berdikari", "a": "#F59E0B", "b": "#84CC16", "icon": "💼"}, {"id": "p10", "no": 10, "bidang": "Akidah", "title": "Maha Pembalas dan Maha Perkasa (al-Muntaqim & al-Jabbar)", "game": "Dua Nama Agung", "a": "#F97316", "b": "#6366F1", "icon": "⚡"}, {"id": "p11", "no": 11, "bidang": "Akidah", "title": "Perkara yang Membatalkan Iman", "game": "Perisai Iman", "a": "#22D3EE", "b": "#E11D48", "icon": "🛡️"}, {"id": "p12", "no": 12, "bidang": "Akidah", "title": "Hindari Ajaran Sesat", "game": "Radar Ajaran Sesat", "a": "#2DD4BF", "b": "#F43F5E", "icon": "📡"}, {"id": "p13", "no": 13, "bidang": "Fiqh", "title": "Haji dan Umrah", "game": "Ekspedisi Baitullah", "a": "#FACC15", "b": "#14B8A6", "icon": "🕋"}, {"id": "p14", "no": 14, "bidang": "Fiqh", "title": "Sembelihan", "game": "Inspektor Halal", "a": "#4ADE80", "b": "#F87171", "icon": "🔪"}, {"id": "p15", "no": 15, "bidang": "Fiqh", "title": "Korban dan Akikah", "game": "Misi Korban & Akikah", "a": "#FB923C", "b": "#A78BFA", "icon": "🐑"}, {"id": "p16", "no": 16, "bidang": "Fiqh", "title": "Muamalat Islam", "game": "Pasar Muamalat", "a": "#34D399", "b": "#FBBF24", "icon": "🏪"}, {"id": "p17", "no": 17, "bidang": "Fiqh", "title": "Solat Sunat Dhuha dan Solat Sunat Gerhana", "game": "Matahari & Gerhana", "a": "#FDE047", "b": "#6366F1", "icon": "🌗"}, {"id": "p18", "no": 18, "bidang": "Sirah dan Tamadun Islam", "title": "Kerajaan Khulafa' al-Rasyidin", "game": "Takhta Khulafa'", "a": "#FCD34D", "b": "#10B981", "icon": "👑"}, {"id": "p19", "no": 19, "bidang": "Sirah dan Tamadun Islam", "title": "Kerajaan Umaiyah", "game": "Empayar Damsyik", "a": "#F472B6", "b": "#22D3EE", "icon": "🏰"}, {"id": "p20", "no": 20, "bidang": "Sirah dan Tamadun Islam", "title": "Kerajaan Abbasiyah", "game": "Legenda Baghdad", "a": "#818CF8", "b": "#FBBF24", "icon": "📚"}, {"id": "p21", "no": 21, "bidang": "Sirah dan Tamadun Islam", "title": "Keunggulan Tokoh Empat Mazhab", "game": "Majlis Empat Imam", "a": "#2DD4BF", "b": "#C084FC", "icon": "🕯️"}, {"id": "p22", "no": 22, "bidang": "Akhlak Islamiah", "title": "Bersikap Benar Menjauhkan Kemunafikan", "game": "Detektif Kebenaran", "a": "#38BDF8", "b": "#F43F5E", "icon": "🔍"}, {"id": "p23", "no": 23, "bidang": "Akhlak Islamiah", "title": "Konsep Khauf dan Raja'", "game": "Neraca Hati", "a": "#A78BFA", "b": "#34D399", "icon": "⚖️"}, {"id": "p24", "no": 24, "bidang": "Akhlak Islamiah", "title": "Adab terhadap Orang Sakit dan Kurang Upaya", "game": "Misi Ihsan", "a": "#F472B6", "b": "#38BDF8", "icon": "💗"}, {"id": "p25", "no": 25, "bidang": "Akhlak Islamiah", "title": "Wasatiyyah Menjamin Kecemerlangan Umat", "game": "Ummatan Wasatan", "a": "#22D3EE", "b": "#FACC15", "icon": "🎯"}];
const B=[['Al-Quran','📖'],['Hadis','📜'],['Akidah','☝️'],['Fiqh','🕋'],['Sirah dan Tamadun Islam','🏛️'],['Akhlak Islamiah','💎']];
function prog(id){try{const v=JSON.parse(localStorage.getItem('alfaqih_t4_'+id));if(v&&v.st)return{s:v.st.reduce((a,x)=>a+x.stars,0),d:v.st.every(x=>x.stars>0)}}catch(e){}return{s:0,d:false}}
let cur='Semua';let TS=0,TD=0;
function render(){TS=0;TD=0;
 document.getElementById('tabs').innerHTML=['Semua',...B.map(b=>b[0])].map(t=>`<button class="tab ${t===cur?'on':''}" data-t="${t}">${t==='Semua'?'🌐 Semua':B.find(b=>b[0]===t)[1]+' '+t}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
 document.getElementById('list').innerHTML=B.filter(b=>cur==='Semua'||b[0]===cur).map(([bn,ic])=>`<div class="sec"><h2>${ic} ${bn}</h2><div class="grid3">${L.filter(l=>l.bidang===bn).map(l=>{const p=prog(l.id);return `<a class="gc" href="${l.id}/" style="--ca:${l.a}"><button class="cp" data-id="${l.id}" data-t="P${l.no} · ${l.game}">🔗 Link</button><div class="no">PELAJARAN ${l.no}${p.d?' · ✅ TAMAT':''}</div><div class="ic">${l.icon}</div><div class="gn">${l.game}</div><div class="tt">${l.title}</div><div class="pr"><span>⭐ ${p.s}/15</span><div class="bar"><i style="width:${p.s/15*100}%"></i></div></div></a>`}).join('')}</div></div>`).join('');
 L.forEach(l=>{const p=prog(l.id);TS+=p.s;TD+=p.d?1:0});document.querySelectorAll('.gc .cp').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const u=new URL(b.dataset.id+'/',location.href).href;window.alfaqihShare?alfaqihShare(u,b.dataset.t):null});document.getElementById('ts').textContent=TS;document.getElementById('td').textContent=TD}
render();
</script>
